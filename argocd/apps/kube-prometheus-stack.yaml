apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 65.1.1
    helm:
      values: |
        prometheus:
          prometheusSpec:
            serviceMonitorSelectorNilUsesHelmValues: false
        grafana:
          adminPassword: admin123

        alertmanager:
          config:
            global:
              smtp_smarthost: 'smtp.gmail.com:587'
              smtp_from: 'vvuhoangg186@gmail.com'
              smtp_auth_username: 'vvuhoangg186@gmail.com'
              smtp_auth_password: 'mmfm bbrj jszg wiwb'
              smtp_require_tls: true

            route:
              receiver: gmail
              group_by:
                - namespace
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h

              routes:
                - matchers:
                    - alertname="Watchdog"
                  receiver: gmail

            receivers:
              - name: gmail
                email_configs:
                  - to: 'vvuhoangg186@gmail.com'
                    send_resolved: true

              - name: "null"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
