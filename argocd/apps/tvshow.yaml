apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tvshow
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hoangvu186/gitops.git
    targetRevision: HEAD
    path: k8s-tvshow
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
